name: Gemini AI Coding Agent & Reviewer

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-agent:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini')) ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Gemini Agent ausführen (Dateien erstellen & committen)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          python - << 'EOF'
          import os
          import subprocess
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          event_name = os.environ.get("EVENT_NAME")
          issue_body = os.environ.get("ISSUE_BODY", "")
          comment_body = os.environ.get("COMMENT_BODY", "")
          pr_number = os.environ.get("PR_NUMBER")

          client = genai.Client(api_key=api_key)
          prompt_text = issue_body if event_name == "issues" else comment_body

          if "@gemini" in prompt_text:
              user_task = prompt_text.replace("@gemini", "").strip()
              print(f"Verarbeite Aufgabe: {user_task}")

              system_prompt = f"""
              Du bist ein Software-Entwickler für ein 3D-Drucker- und Embedded-Projekt (RRF 3.x, ESP32, CAD).
              Führe die im Benutzerauftrag genannten Ordnerpfade und README-Inhalte EXAKT wie vorgegeben aus.
              Erstelle keine generischen Web-Entwicklungsordner (wie backend, frontend, docs).

              Benutzerauftrag:
              {user_task}

              Gib als Antwort AUSSCHLIESSLICH ein ausführbares Bash-Skript zurück (ohne Markdown ```bash Wrappers).
              - Erstelle Ordner mit `mkdir -p <pfad>`
              - Erstelle README.md Dateien mit `cat << 'EOF' > <pfad>/README.md`
              - Lösche alte/falsche Ordner (wie backend, frontend, docs, scripts) falls nötig per `rm -rf`.
              """

              response = client.models.generate_content(
                  model="gemini-3.6-flash",
                  contents=system_prompt
              )

              bash_script = response.text.replace("```bash", "").replace("```", "").strip()
              with open("generate_structure.sh", "w", encoding="utf-8") as f:
                  f.write(bash_script)

              subprocess.run(["bash", "generate_structure.sh"], check=True)

              # Temporäre Skriptdatei aufräumen
              if os.path.exists("generate_structure.sh"):
                  os.remove("generate_structure.sh")

              # Git Config & Commit
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"])
              subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"])
              subprocess.run(["git", "add", "."])
              
              status = subprocess.check_output(["git", "status", "--porcelain"], text=True)
              if status.strip():
                  subprocess.run(["git", "commit", "-m", "refactor: Ordnerstruktur auf RRF/ESP32 Projektvorgaben korrigiert"])
                  subprocess.run(["git", "push"])
                  message = "✅ Ordnerstruktur wurde erfolgreich korrigiert und bereinigt!"
              else:
                  message = "Keine Änderungen vorgenommen."

              with open("res.md", "w") as f:
                  f.write(message)
              subprocess.run(["gh", "issue", "comment", str(pr_number), "--body-file", "res.md"])
          EOF
